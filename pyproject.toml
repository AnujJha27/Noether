[project]
name = "noether"
version = "0.1.0"
description = "Lean proof-search verifier and DFT architecture certification research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Anuj" }
]
keywords = ["lean", "proof-search", "formal-methods", "dft", "research-prototype"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
noether = "dftcert.local_cli:main"
noether-structural = "dftcert.structural.cli:main"
noether-dftcert = "dftcert.legacy.cli:main"
noether-orchestrator = "orchestrator.cli:main"
noether-replay = "orchestrator.replay:main"
noether-tui = "dftcert.tui:main"

[tool.setuptools]
packages = ["dftcert", "dftcert.legacy", "dftcert.structural", "orchestrator", "extractors"]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py311"
