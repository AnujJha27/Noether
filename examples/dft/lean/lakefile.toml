name = "noether-dft-example"
version = "0.1.0"
keywords = ["math", "dft", "verification"]
defaultTargets = ["Testv2"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "Testv2"
